<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Containerised runtimes orchestrated on a cluster">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/><stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <linearGradient id="rln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08fdd8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#08fdd8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#08fdd8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#rbg)"/>
  <g stroke="#08fdd8" stroke-opacity=".1">
    <path d="M0 90h640M0 180h640M0 270h640M160 0v360M320 0v360M480 0v360"/>
  </g>

  <!-- orchestrator node -->
  <g transform="translate(320 90)">
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17"
             fill="none" stroke="#08fdd8" stroke-width="2"/>
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#08fdd8" fill-opacity=".85"/>
  </g>

  <!-- links to pods -->
  <g stroke="#08fdd8" stroke-opacity=".45" stroke-width="1.5" fill="none">
    <path d="M320 130 L160 205"/><path d="M320 130 L320 205"/><path d="M320 130 L480 205"/>
  </g>

  <!-- language pods -->
  <g font-family="ui-monospace,monospace" font-size="17" font-weight="700" text-anchor="middle">
    <g transform="translate(160 205)">
      <rect x="-58" y="0" width="116" height="74" rx="9" fill="#0c1a1a" stroke="#08fdd8" stroke-width="1.6"/>
      <text x="0" y="34" fill="#08fdd8">Rust</text>
      <rect x="-40" y="48" width="80" height="4" rx="2" fill="#08fdd8" fill-opacity=".35"/>
    </g>
    <g transform="translate(320 205)">
      <rect x="-58" y="0" width="116" height="74" rx="9" fill="#0c1a1a" stroke="#08fdd8" stroke-width="1.6"/>
      <text x="0" y="34" fill="#08fdd8">Go</text>
      <rect x="-40" y="48" width="80" height="4" rx="2" fill="#08fdd8" fill-opacity=".35"/>
    </g>
    <g transform="translate(480 205)">
      <rect x="-58" y="0" width="116" height="74" rx="9" fill="#0c1a1a" stroke="#fd1056" stroke-width="1.6"/>
      <text x="0" y="34" fill="#fd1056">Python</text>
      <rect x="-40" y="48" width="80" height="4" rx="2" fill="#fd1056" fill-opacity=".35"/>
    </g>
  </g>

  <!-- socket stream -->
  <rect x="60" y="316" width="520" height="2" fill="url(#rln)"/>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#6c6c78">
    <text x="60" y="342">socket.io · realtime exec</text>
    <text x="580" y="342" text-anchor="end">k8s</text>
  </g>
</svg>
