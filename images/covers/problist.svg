<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Competitive programming progress chart with a solved-problem streak">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a1a"/><stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <linearGradient id="pfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08fdd8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#08fdd8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#pbg)"/>
  <g stroke="#08fdd8" stroke-opacity=".1">
    <path d="M0 80h640M0 150h640M0 220h640M0 290h640"/>
  </g>

  <!-- rating curve -->
  <path d="M40 290 L120 258 L200 268 L280 214 L360 196 L440 140 L520 122 L600 74"
        fill="none" stroke="#08fdd8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M40 290 L120 258 L200 268 L280 214 L360 196 L440 140 L520 122 L600 74 L600 320 L40 320Z"
        fill="url(#pfill)"/>
  <g fill="#08fdd8">
    <circle cx="120" cy="258" r="4"/><circle cx="280" cy="214" r="4"/>
    <circle cx="440" cy="140" r="4"/><circle cx="600" cy="74" r="5"/>
  </g>

  <!-- streak grid -->
  <g transform="translate(40 36)">
    <text font-family="ui-monospace,monospace" font-size="11" fill="#6c6c78" y="-8">solve streak</text>
    <g>
      <rect width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".25"/>
      <rect x="15" width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".55"/>
      <rect x="30" width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".9"/>
      <rect x="45" width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".4"/>
      <rect x="60" width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".95"/>
      <rect x="75" width="11" height="11" rx="2" fill="#fd1056" fill-opacity=".8"/>
      <rect x="90" width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".6"/>
      <rect x="105" width="11" height="11" rx="2" fill="#08fdd8" fill-opacity=".85"/>
    </g>
  </g>

  <g font-family="ui-monospace,monospace">
    <text x="40" y="120" font-size="40" font-weight="700" fill="#08fdd8">1000+</text>
    <text x="40" y="142" font-size="12" fill="#6c6c78">problems solved</text>
    <text x="600" y="344" font-size="12" fill="#6c6c78" text-anchor="end">expert · 4★</text>
  </g>
</svg>
