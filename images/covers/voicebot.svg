<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Voice waveform converted into a conversational reply">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d14"/><stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#vbg)"/>
  <g stroke="#fd1056" stroke-opacity=".08">
    <path d="M0 90h640M0 180h640M0 270h640"/>
  </g>

  <!-- mic -->
  <g transform="translate(84 152)" fill="none" stroke="#fd1056" stroke-width="2.4">
    <rect x="-13" y="-30" width="26" height="42" rx="13"/>
    <path d="M-24 4a24 24 0 0 0 48 0"/>
    <path d="M0 28v14M-12 42h24" stroke-linecap="round"/>
  </g>

  <!-- waveform -->
  <g stroke="#fd1056" stroke-width="4" stroke-linecap="round">
    <path d="M160 152v-26M180 152v-46M200 152v-16M220 152v-58M240 152v-34M260 152v-70M280 152v-24M300 152v-44"
          transform="translate(0 26)"/>
  </g>
  <g stroke="#08fdd8" stroke-width="4" stroke-linecap="round">
    <path d="M320 152v-38M340 152v-62M360 152v-20M380 152v-50M400 152v-30M420 152v-58M440 152v-18M460 152v-40"
          transform="translate(0 26)"/>
  </g>

  <!-- reply bubble -->
  <g transform="translate(120 232)">
    <rect width="400" height="56" rx="14" fill="#07100f" stroke="#08fdd8" stroke-opacity=".5"/>
    <path d="M28 56 l0 18 l22 -18Z" fill="#07100f" stroke="#08fdd8" stroke-opacity=".5"/>
    <text x="22" y="35" font-family="ui-monospace,monospace" font-size="15" fill="#08fdd8">
      "here's what I found —"
    </text>
  </g>

  <g font-family="ui-monospace,monospace" font-size="12" fill="#6c6c78">
    <text x="40" y="332">speech in</text>
    <text x="600" y="332" text-anchor="end">response out · live</text>
  </g>
</svg>
